<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Journal — Dreamless_Boy" />
    <title>Dreamless_Boy | Journal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="container">
      <nav class="page-home-nav" aria-label="Page navigation">
        <a class="page-home-link" href="home.html" aria-label="Go to Home">
          <span aria-hidden="true">← </span>Home
        </a>
      </nav>
      <div class="journal-layout">
        <main class="journal-stream">
          <header class="page-head page-head--center journal-head">
            <h1>Inner Monologue</h1>
            <p>Timestamped fragments of thoughts.</p>
          </header>
          <div
            class="writings-filter journal-filter"
            role="tablist"
            aria-label="Journal filters"
          >
            <button
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="journal-entries"
              class="journal-filter-btn active"
              data-journal-filter="journal"
            >
              [Journal]
            </button>
            <button
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="journal-entries"
              class="journal-filter-btn"
              data-journal-filter="indexes"
            >
              [Indexes]
            </button>
            <button
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="journal-entries"
              class="journal-filter-btn"
              data-journal-filter="all"
            >
              [All]
            </button>
          </div>
          <div id="journal-entries" role="tabpanel"></div>
        </main>
      </div>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/pages/journal.js"></script>
    <script src="js/lofi-player.js"></script>
    <script src="js/site.js"></script>
  </body>
</html>
