<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Photographs by Dreamless_Boy." />
    <title>Dreamless_Boy | Photography</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="container">
      <div id="headerPlaceholder"></div>
      <main class="photography-layout">
        <section class="photography-hero">
          <p class="guestbook-kicker">Collected moments</p>
          <h1 class="photography-title">Photography</h1>
          <p class="photography-lead">A collection of pictures I've taken.</p>
        </section>

        <section class="photography-gallery" aria-label="Photo gallery">
          <div
            class="photography-gallery-grid"
            data-photography-grid
            aria-live="polite"
          ></div>
          <p class="photography-empty" data-photography-empty>
            Loading photographs…
          </p>
        </section>
      </main>
      <div id="footerPlaceholder"></div>
    </div>

    <script src="js/lofi-player.js"></script>
    <script src="js/site.js"></script>
    <script src="js/pages/photography.js"></script>
  </body>
</html>
