<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Photographs by Tobias AEI." />
    <title>Tobias_AEI | Photography</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="container">
      <div id="headerPlaceholder"></div>
      <main class="photography-layout">
        <section class="photography-hero">
          <p class="guestbook-kicker">Collected moments</p>
          <h1 class="photography-title">Photography</h1>
          <p class="photography-lead">
            A collection of pictures I've taken.
          </p>
        </section>

        <section class="photography-gallery" aria-label="Photo gallery">
          <div
            class="photography-gallery-grid"
            data-photography-grid
            aria-live="polite"
          ></div>
          <p class="photography-empty" data-photography-empty>
            Loading photographs…
          </p>
        </section>
      </main>
      <div id="footerPlaceholder"></div>
    </div>

    <script src="main.js"></script>
    <script>
      (function () {
        var grid = document.querySelector("[data-photography-grid]");
        var empty = document.querySelector("[data-photography-empty]");
        if (!grid || !empty) return;

        function showEmpty(message) {
          empty.textContent = message;
          empty.hidden = false;
        }

        fetch("data/photography.json", { cache: "no-store" })
          .then(function (response) {
            if (!response.ok) throw new Error("Could not load the photo catalog.");
            return response.json();
          })
          .then(function (photos) {
            if (!Array.isArray(photos)) {
              throw new Error("The photo catalog must contain a list.");
            }

            var validPhotos = photos.filter(function (photo) {
              return (
                photo &&
                typeof photo.src === "string" &&
                photo.src.indexOf("photos/") === 0 &&
                photo.src.split("/").indexOf("..") === -1 &&
                typeof photo.alt === "string" &&
                photo.alt.trim()
              );
            });

            if (!validPhotos.length) {
              showEmpty(
                "No photographs yet. Add images to the photos/ folder and list them in data/photography.json."
              );
              return;
            }

            empty.hidden = true;
            validPhotos.forEach(function (photo) {
              var figure = document.createElement("figure");
              figure.className = "photography-card";

              var image = document.createElement("img");
              image.src = photo.src;
              image.alt = photo.alt;
              image.loading = "lazy";
              image.decoding = "async";
              figure.appendChild(image);

              if (typeof photo.caption === "string" && photo.caption.trim()) {
                var caption = document.createElement("figcaption");
                caption.className = "photography-caption";
                caption.textContent = photo.caption;
                figure.appendChild(caption);
              }

              grid.appendChild(figure);
            });
          })
          .catch(function (error) {
            showEmpty(error.message);
          });
      })();
    </script>
  </body>
</html>
