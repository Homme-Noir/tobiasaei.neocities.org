<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta

      content="Dreamless_Boy — personal site. Enter the lab."

    <title>Dreamless_Boy | Start</title>
    <link rel="stylesheet" href="css/intro.css" />

  <body>
    <img
      class="entry-backdrop"
      src="backdrop.webp"
      alt=""
      fetchpriority="high"
      decoding="async"
    />
    <div class="entry-image-shade" aria-hidden="true"></div>
    <div class="vhs-overlay" aria-hidden="true">
      <div class="vhs-vignette"></div>
      <div class="vhs-flicker"></div>
      <div class="vhs-roll"></div>
    </div>

    <main class="entry">
      <section>
        <p class="entry-label">
          <span aria-hidden="true"></span> Welcome back · home system
        </p>
        <h1>
          <span class="flicker1">D</span>ream<span class="flicker2">l</span>ess
          <span class="flicker3">B</span>oy

        <p class="type-line">
          <span id="typed-line"></span
          ><span class="cursor" aria-hidden="true"></span>
        </p>
        <button
          class="enter-link"
          id="enter-link"
          type="button"
          aria-label="Enter site"
          disabled
        >
          <span>[ Initialize Sequence ]</span>
        </button>
        <p class="entry-divider">Tobi AEI · personal archive</p>
      </section>
    </main>
    <script src="js/pages/intro.js"></script>
