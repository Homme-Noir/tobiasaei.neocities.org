<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Writings — Dreamless_Boy" />
    <title>Dreamless_Boy | Writings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="container">
      <nav class="page-home-nav" aria-label="Page navigation">
        <a class="page-home-link" href="home.html" aria-label="Go to Home">
          <span aria-hidden="true">← </span>Home
        </a>
      </nav>
      <div class="writings-layout">
        <main class="writings-content">
          <header class="page-head">
            <h1>Scattered Writings</h1>
            <p>Poems from my obsidian vault.</p>
          </header>
          <div
            class="writings-filter"
            role="tablist"
            aria-label="Writings filters"
          >
            <button
              type="button"
              role="tab"
              aria-selected="true"
              aria-controls="writings-list"
              class="writings-filter-btn active"
              data-writing-filter="all"
            >
              [All]
            </button>
            <button
              type="button"
              role="tab"
              aria-selected="false"
              aria-controls="writings-list"
              class="writings-filter-btn"
              data-writing-filter="poetry"
            >
              [Poetry]
            </button>
          </div>

          <ul class="writings-entries" id="writings-list" role="tabpanel"></ul>
        </main>
      </div>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/pages/writings.js"></script>
    <script src="js/lofi-player.js"></script>
    <script src="js/site.js"></script>
  </body>
</html>
